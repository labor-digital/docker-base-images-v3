# Publishes every bake target to Docker Hub after a merge to master (.design-log/001 §5):
# native amd64 + arm64 builds pushed by digest, SBOM + max provenance attestations,
# one manifest list per target, keyless cosign signature, then a verify step.
# Docker Hub credentials live only in the "release" environment, which only master may use.
name: Release

on:
  push:
    branches: [master]
    paths:
      - docker-bake.hcl
      - images/**
      - shared/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions: {}

# Never two releases at once: the immutable-tag check and the moving tags must not race
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tag order comes from docker-bake.hcl: moving tags first, the immutable php-X.Y.Z tag last
      - name: List bake targets
        id: list
        run: |
          list=$(docker buildx bake --print 2>/dev/null | jq -c '[.target | to_entries[] | {
            name: .key,
            repo: (.value.tags[-1] | sub(":[^:/]+$"; "")),
            immutable: .value.tags[-1],
            moving: (.value.tags[:-1] | join(" "))
          }]')
          echo "$list" | jq .
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.target.name }}, ${{ matrix.arch }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushes only the digest; tags are set once per target in the publish job
      - name: Build and push by digest
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ matrix.target.name }}
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.tags=${{ matrix.target.repo }}
            *.output=type=image,push-by-digest=true,name-canonical=true,push=true
            *.attest=type=provenance,mode=max
            *.attest=type=sbom
            *.cache-from=type=gha,scope=${{ matrix.target.name }}-${{ matrix.arch }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.target.name }}-${{ matrix.arch }}

      - name: Export digest
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          TARGET: ${{ matrix.target.name }}
        run: |
          digest=$(jq -r --arg t "$TARGET" '.[$t]["containerimage.digest"]' <<< "$METADATA")
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest in bake metadata"; exit 1; }
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.target.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [targets, build]
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # keyless cosign signature via GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.list) }}
    name: publish (${{ matrix.name }})
    env:
      REPO: ${{ matrix.repo }}
      IMMUTABLE: ${{ matrix.immutable }}
      MOVING: ${{ matrix.moving }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - name: Create manifest list and tags
        id: index
        working-directory: /tmp/digests
        run: |
          sources=()
          for d in *; do sources+=("$REPO@sha256:$d"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 platform digests, got ${#sources[@]}"; exit 1; }

          # The immutable tag is written once and never overwritten. Only a clear "not found" counts as
          # missing; any other error (network, auth, rate limit) stops the release instead of overwriting.
          if out=$(docker buildx imagetools inspect "$IMMUTABLE" 2>&1); then
            echo "::notice::$IMMUTABLE already published, left unchanged"
          elif grep -qi "not found" <<< "$out"; then
            docker buildx imagetools create -t "$IMMUTABLE" "${sources[@]}"
          else
            echo "$out"; echo "::error::could not check whether $IMMUTABLE exists"; exit 1
          fi

          tags=()
          for t in $MOVING; do tags+=(-t "$t"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

          first=${MOVING%% *}
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "::error::no manifest list digest for $first"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$REPO@$DIGEST"

      # Acceptance check of phase 3: signature and SBOM can be verified on the published manifest list
      - name: Verify
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify "$REPO@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          docker buildx imagetools inspect "$REPO@$DIGEST" --format '{{json .SBOM}}' \
            | jq -e '[.. | objects | select(has("SPDX"))] | length == 2' > /dev/null \
            || { echo "::error::SBOM missing for at least one platform"; exit 1; }
          echo "::notice::$REPO@$DIGEST published, signed, SBOM present ($MOVING)"
