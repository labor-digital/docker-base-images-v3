# Required check "pr" for every pull request. Builds and tests, never pushes, uses no secrets.
# Third-party actions and tool images are pinned to a commit SHA / digest (Renovate keeps them current).
name: PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: hadolint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27 \
            hadolint images/*/Dockerfile

      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files '*.sh' '*/.bashrc')
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            --shell=bash --severity=warning "${files[@]}"

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  targets:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List bake targets
        id: list
        run: |
          list=$(docker buildx bake --print 2>/dev/null | jq -c '[.target | to_entries[] | {
            name: .key,
            stage: .value.target,
            version: .value.labels["org.opencontainers.image.version"],
            image: .value.tags[-1]
          }]')
          echo "$list" | jq .
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: [lint, targets]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.list) }}
    name: build (${{ matrix.name }})
    env:
      TARGET: ${{ matrix.name }}
      STAGE: ${{ matrix.stage }}
      VERSION: ${{ matrix.version }}
      # not IMAGE: bake reads env vars named like its variables and would override IMAGE in docker-bake.hcl
      IMAGE_REF: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only in PRs: arm64 is built natively after merge (release.yml) and checked by the reviewer locally.
      # Cache scope matches release.yml, so PRs reuse the cache written by the last release from master.
      - name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ matrix.name }}
          load: true
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=${{ matrix.name }}-amd64
            *.cache-to=type=gha,mode=max,scope=${{ matrix.name }}-amd64

      - name: Smoke test
        run: tests/smoke.sh "$IMAGE_REF" "$STAGE" "$VERSION"

      # Fails on a fixable CRITICAL. The regression-only gate against the published tag comes with the
      # auto lane (.design-log/001 §4.1, phase 3b), once published tags exist.
      - name: Trivy (CRITICAL, fixable)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE_REF"

      - name: Trivy (HIGH, report only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --scanners vuln --severity HIGH --ignore-unfixed --exit-code 0 --no-progress "$IMAGE_REF"

  # Single stable name for the ruleset's required check, independent of how many targets exist
  pr:
    if: always()
    needs: [lint, targets, build]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
